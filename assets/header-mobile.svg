<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" role="img" aria-label="Alexandre Correia — Full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a36"/>
      <stop offset="1" stop-color="#1b1240"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.7" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#7dd3fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="fade" cx="0.3" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="400" height="600" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="400" height="600" rx="22"/></clipPath>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.55"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .b1 { animation: drift1 14s ease-in-out infinite alternate; }
      .b2 { animation: drift2 18s ease-in-out infinite alternate; }
      .b3 { animation: drift3 16s ease-in-out infinite alternate; }
      @keyframes drift1 { to { transform: translate(60px, 80px); } }
      @keyframes drift2 { to { transform: translate(-80px, -60px); } }
      @keyframes drift3 { to { transform: translate(-60px, 50px); } }

      .rise { opacity: 0; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.5s; } .d4 { animation-delay: 0.7s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

      .role { opacity: 0; animation: type 12s infinite both; }
      .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; }
      @keyframes type {
        0%   { opacity: 1; clip-path: inset(0 100% 0 0); animation-timing-function: steps(26, end); }
        11%  { opacity: 1; clip-path: inset(0 0 0 0); }
        30%  { opacity: 1; clip-path: inset(0 0 0 0); }
        33%, 100% { opacity: 0; clip-path: inset(0 0 0 0); }
      }

      .caret { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .line { opacity: 0; animation: rise 0.6s ease-out forwards; }
      .l1 { animation-delay: 0.6s; } .l2 { animation-delay: 0.85s; } .l3 { animation-delay: 1.1s; }
      .l4 { animation-delay: 1.35s; } .l5 { animation-delay: 1.6s; } .l6 { animation-delay: 1.85s; }

      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

      .k { fill: #c084fc; } .v { fill: #7dd3fc; } .s { fill: #86efac; } .p { fill: #cbd5e1; } .c { fill: #64748b; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="400" height="600" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.75">
      <circle class="b1" cx="80" cy="90" r="120" fill="#6366f1"/>
      <circle class="b2" cx="340" cy="520" r="140" fill="#db2777" opacity="0.7"/>
      <circle class="b3" cx="330" cy="200" r="100" fill="#0ea5e9" opacity="0.65"/>
    </g>
    <rect width="400" height="600" fill="url(#grid)" mask="url(#gridMask)"/>
  </g>
  <rect x="0.75" y="0.75" width="398.5" height="598.5" rx="21.5" fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <!-- Left: intro -->
  <g class="sans">
    <g class="rise d1">
      <rect x="28" y="40" width="196" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle class="pulse" cx="48" cy="55" r="5" fill="#4ade80"/>
      <text x="62" y="60" font-size="13.5" fill="#cbd5e1" letter-spacing="0.3">Olá, eu sou o 👋</text>
    </g>
    <text class="rise d2" x="26" y="128" font-size="50" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Alexandre</text>
    <text class="rise d2" x="26" y="184" font-size="50" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Correia</text>

    <g class="rise d3 mono" font-size="17" fill="#e2e8f0">
      <text x="28" y="230" fill="#a78bfa">&gt;</text>
      <text class="role" x="48" y="230">Full-stack developer</text>
      <text class="role r2" x="48" y="230">Apps Android para a fábrica</text>
      <text class="role r3" x="48" y="230">APIs .NET &amp; integrações ERP</text>
    </g>

    <g class="rise d4" font-size="13" fill="#94a3b8">
      <text x="28" y="268">📍 Portugal</text>
      <text x="132" y="268">🏭 Fibope Portuguesa</text>
    </g>
  </g>

  <!-- Right: code window -->
  <g transform="translate(28 310)">
    <g class="rise d2">
      <rect width="344" height="236" rx="14" fill="#0b1020" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.12"/>
      <path d="M14 0h316a14 14 0 0 1 14 14v22H0V14A14 14 0 0 1 14 0z" fill="#ffffff" fill-opacity="0.05"/>
      <circle cx="20" cy="18" r="5.5" fill="#f87171"/>
      <circle cx="38" cy="18" r="5.5" fill="#fbbf24"/>
      <circle cx="56" cy="18" r="5.5" fill="#4ade80"/>
      <text x="172" y="22.5" text-anchor="middle" class="mono" font-size="11.5" fill="#64748b">alexandre.ts</text>
    </g>
    <g class="mono" font-size="12">
      <text class="line l1" x="18" y="68"><tspan class="k">const</tspan><tspan class="p"> alexandre = {</tspan></text>
      <text class="line l2" x="32" y="94"><tspan class="v">role</tspan><tspan class="p">: </tspan><tspan class="s">"Developer @ Fibope"</tspan><tspan class="p">,</tspan></text>
      <text class="line l3" x="32" y="120"><tspan class="v">stack</tspan><tspan class="p">: [</tspan><tspan class="s">".NET"</tspan><tspan class="p">, </tspan><tspan class="s">"Kotlin"</tspan><tspan class="p">, </tspan><tspan class="s">"React"</tspan><tspan class="p">],</tspan></text>
      <text class="line l4" x="32" y="146"><tspan class="v">builds</tspan><tspan class="p">: </tspan><tspan class="s">"apps que a fábrica usa"</tspan><tspan class="p">,</tspan></text>
      <text class="line l5" x="32" y="172"><tspan class="v">coffee</tspan><tspan class="p">: </tspan><tspan class="k">Infinity</tspan><tspan class="p">,</tspan></text>
      <text class="line l6" x="18" y="198"><tspan class="p">};</tspan></text>
    </g>
    <rect class="caret" x="38" y="186" width="8" height="16" rx="1" fill="#a78bfa"/>
  </g>
</svg>
