<svg xmlns="http://www.w3.org/2000/svg" width="280" height="56" viewBox="0 0 280 56" role="img" aria-label="Falar comigo no LinkedIn">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a66c2"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="280" height="56" rx="28"/></clipPath>
    <style>
      .sweep { animation: sweep 3.5s ease-in-out infinite; }
      @keyframes sweep { 0% { translate: -120px 0; } 60%, 100% { translate: 300px 0; } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="280" height="56" fill="url(#bg)"/>
    <rect class="sweep" x="0" y="0" width="90" height="56" fill="url(#shine)" transform="skewX(-20)"/>
  </g>
  <rect x="20" y="15" width="26" height="26" rx="5" fill="#fff"/>
  <path fill="#0a66c2" d="M25.2 23.6h3.4v11h-3.4zm1.7-5.4a2 2 0 1 1 0 3.9 2 2 0 0 1 0-3.9zm3.8 5.4h3.3v1.5c.5-.9 1.6-1.8 3.3-1.8 3.5 0 4.2 2.3 4.2 5.3v6h-3.4v-5.3c0-1.3 0-2.9-1.8-2.9s-2.1 1.4-2.1 2.8v5.4h-3.4z"/>
  <text x="58" y="34.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Vamos falar no LinkedIn →</text>
</svg>
